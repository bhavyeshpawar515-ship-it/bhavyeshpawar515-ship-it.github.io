<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:450px;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:17px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#2563eb;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#result{
margin-top:20px;
font-size:18px;
line-height:1.8;
font-weight:bold;
text-align:center;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}
</style>

<body>

<div class="container">

<h1>📈 SIP Calculator</h1>

<input type="number" id="monthly" placeholder="Monthly Investment (₹)">

<input type="number" id="rate" placeholder="Annual Return Rate (%)">

<input type="number" id="years" placeholder="Investment Period (Years)">

<button onclick="calculateSIP()">Calculate</button>

<div id="result"></div>

<a class="back" href="calculators.html">⬅ Back to Calculators</a>

</div>

<script>

function calculateSIP(){

let P=parseFloat(document.getElementById("monthly").value);
let annualRate=parseFloat(document.getElementById("rate").value);
let years=parseFloat(document.getElementById("years").value);

if(isNaN(P)||isNaN(annualRate)||isNaN(years)||P<=0||annualRate<=0||years<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let r=annualRate/12/100;
let n=years*12;

let maturity=P*((Math.pow(1+r,n)-1)/r)*(1+r);
let invested=P*n;
let profit=maturity-invested;

document.getElementById("result").innerHTML=
"Total Investment: ₹"+invested.toFixed(2)+"<br><br>"+
"Estimated Returns: ₹"+profit.toFixed(2)+"<br><br>"+
"Maturity Value: ₹"+maturity.toFixed(2);

}

</script>

</body>
