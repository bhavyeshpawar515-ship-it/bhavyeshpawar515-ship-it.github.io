<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cut Video | SmartToolsHub</title>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#2563eb,#0f172a);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2563eb;
    margin-bottom:20px;
}

.upload-box{
    border:3px dashed #2563eb;
    border-radius:12px;
    padding:40px;
    text-align:center;
    cursor:pointer;
    margin-bottom:20px;
}

input[type=file]{
    display:none;
}

video{
    width:100%;
    margin-top:20px;
    border-radius:12px;
}

.input-group{
    margin-top:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input[type=number]{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:20px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>✂️ Cut Video</h1>

<label for="videoInput" class="upload-box">

<h2>📂 Upload Video</h2>

<p>Select a video file</p>

</label>

<input
type="file"
id="videoInput"
accept="video/*">

<video
id="preview"
controls
style="display:none;">
</video>

<div class="input-group">

<label>Start Time (seconds)</label>

<input
type="number"
id="startTime"
placeholder="0">

</div>

<div class="input-group">

<label>End Time (seconds)</label>

<input
type="number"
id="endTime"
placeholder="10">

</div>

<button onclick="cutVideo()">

Cut Video

</button>

<p id="status"></p>

<a href="video-tools.html" class="back">

⬅ Back to Video Tools

</a>

</div>

<script>

const videoInput =
document.getElementById("videoInput");

const preview =
document.getElementById("preview");

videoInput.addEventListener(

"change",

function(e){

const file = e.target.files[0];

if(!file) return;

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

}

);

async function cutVideo(){

const file =
videoInput.files[0];

if(!file){

alert("Please upload a video.");

return;

}

const start =
document.getElementById(
"startTime"
).value;

const end =
document.getElementById(
"endTime"
).value;

if(start === "" || end === ""){

alert(
"Enter start and end time."
);

return;

}

document.getElementById(
"status"
).innerText =

"Video cutting feature will be added using FFmpeg.";

}

</script>

</body>

</html>
