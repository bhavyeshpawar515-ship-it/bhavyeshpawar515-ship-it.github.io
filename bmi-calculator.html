<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#0f172a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:520px;
background:#fff;
padding:30px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
font-size:16px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
}

input:focus{
border-color:#2563eb;
}

.buttons{
display:flex;
gap:10px;
margin-top:20px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.calculate{
background:#2563eb;
color:#fff;
}

.reset{
background:#ef4444;
color:#fff;
}

.result{
display:none;
margin-top:25px;
background:#f8fafc;
padding:20px;
border-radius:12px;
}

.result h2{
text-align:center;
color:#16a34a;
margin-bottom:15px;
}

.result p{
font-size:18px;
margin:8px 0;
}

.back{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
font-weight:bold;
color:#2563eb;
}

</style>

<body>

<div class="container">

<h1>⚖️ BMI Calculator</h1>

<div class="input-group">
<label>Height (cm)</label>
<input type="number" id="height" placeholder="Enter Height">
</div>

<div class="input-group">
<label>Weight (kg)</label>
<input type="number" id="weight" placeholder="Enter Weight">
</div>

<div class="buttons">

<button class="calculate" onclick="calculateBMI()">
Calculate
</button>

<button class="reset" onclick="resetBMI()">
Reset
</button>

</div>

<div class="result" id="resultBox">

<h2>Your BMI</h2>

<p><strong>BMI:</strong> <span id="bmiValue">0</span></p>

<p><strong>Category:</strong> <span id="bmiCategory">-</span></p>

</div>

<a href="calculators.html" class="back">
⬅ Back to Calculators
</a>

</div>

<script>


  function calculateBMI(){

const height = parseFloat(document.getElementById("height").value);
const weight = parseFloat(document.getElementById("weight").value);

if(isNaN(height) || isNaN(weight) || height<=0 || weight<=0){

alert("Please enter valid height and weight.");

return;

}

const heightInMeter = height / 100;

const bmi = weight / (heightInMeter * heightInMeter);

let category = "";

if(bmi < 18.5){

category = "Underweight";

}else if(bmi < 25){

category = "Normal Weight";

}else if(bmi < 30){

category = "Overweight";

}else{

category = "Obese";

}

document.getElementById("bmiValue").innerHTML = bmi.toFixed(2);

document.getElementById("bmiCategory").innerHTML = category;

document.getElementById("resultBox").style.display = "block";

}

function resetBMI(){

document.getElementById("height").value = "";

document.getElementById("weight").value = "";

document.getElementById("bmiValue").innerHTML = "0";

document.getElementById("bmiCategory").innerHTML = "-";

document.getElementById("resultBox").style.display = "none";

}

</script>

</body>
