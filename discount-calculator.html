<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:450px;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:17px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#2563eb;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#result{
margin-top:20px;
font-size:18px;
line-height:1.8;
font-weight:bold;
text-align:center;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}

<body>

<div class="container">

<h1>🏷️ Discount Calculator</h1>

<input type="number" id="price" placeholder="Original Price (₹)">

<input type="number" id="discount" placeholder="Discount (%)">

<button onclick="calculateDiscount()">Calculate</button>

<div id="result"></div>

<a class="back" href="calculators.html">⬅ Back to Calculators</a>

</div>

<script>

function calculateDiscount(){

let price=parseFloat(document.getElementById("price").value);
let discount=parseFloat(document.getElementById("discount").value);

if(isNaN(price)||isNaN(discount)||price<=0||discount<0||discount>100){

document.getElementById("result").innerHTML="Please enter valid values.";

return;

}

let save=(price*discount)/100;
let finalPrice=price-save;

document.getElementById("result").innerHTML=

"Original Price : ₹"+price.toFixed(2)+"<br><br>"+

"You Save : ₹"+save.toFixed(2)+"<br><br>"+

"Final Price : ₹"+finalPrice.toFixed(2);

}

</script>

</body>
