<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rotate Image | SmartToolsHub</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <style>

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f7fb;
        }

        .container{
            max-width:900px;
            margin:40px auto;
            padding:20px;
        }

        .card{
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
            text-align:center;
        }

        h1{
            color:#2563eb;
        }

        .upload-box{
            border:3px dashed #2563eb;
            border-radius:12px;
            padding:40px;
            margin:20px 0;
            cursor:pointer;
        }

        input[type=file]{
            display:none;
        }

        img{
            max-width:100%;
            margin-top:20px;
            border-radius:10px;
        }

        select{
            width:100%;
            padding:15px;
            border:1px solid #ccc;
            border-radius:10px;
            margin-top:20px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:#fff;
            font-size:18px;
            cursor:pointer;
            margin-top:20px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔄 Rotate Image</h1>

        <p>Rotate your image online for free.</p>

        <label for="imageInput"
               class="upload-box">

            <h2>📂 Upload Image</h2>

        </label>

        <input type="file"
               id="imageInput"
               accept="image/*">

        <img id="preview"
             style="display:none;">

        <select id="rotation">

            <option value="90">Rotate 90°</option>

            <option value="180">Rotate 180°</option>

            <option value="270">Rotate 270°</option>

        </select>

        <button id="rotateBtn">

            Rotate Image

        </button>

        <a href="image-tools.html"
           class="back">

            ⬅ Back to Image Tools

        </a>

    </div>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

let imageSrc = "";

imageInput.addEventListener("change", e => {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        imageSrc = event.target.result;

        preview.src = imageSrc;

        preview.style.display = "block";

    };

    reader.readAsDataURL(file);

});

document.getElementById("rotateBtn")
.addEventListener("click", () => {

    if (!imageSrc) {

        alert("Please upload an image.");

        return;

    }

    const degree =
    parseInt(
        document.getElementById("rotation").value
    );

    const canvas =
    document.createElement("canvas");

    const ctx =
    canvas.getContext("2d");

    const img =
    new Image();

    img.onload = function(){

        if (degree === 90 || degree === 270) {

            canvas.width = img.height;

            canvas.height = img.width;

        } else {

            canvas.width = img.width;

            canvas.height = img.height;

        }

        ctx.translate(
            canvas.width / 2,
            canvas.height / 2
        );

        ctx.rotate(
            degree * Math.PI / 180
        );

        ctx.drawImage(

            img,

            -img.width / 2,

            -img.height / 2

        );

        const link =
        document.createElement("a");

        link.download =
        "rotated-image.png";

        link.href =
        canvas.toDataURL("image/png");

        link.click();

    };

    img.src = imageSrc;

});

</script>

</body>

</html>
