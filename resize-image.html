<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resize Image | SmartToolsHub</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    text-align:center;
}

h1{
    color:#2563eb;
}

.upload-box{
    border:3px dashed #2563eb;
    border-radius:12px;
    padding:40px;
    margin:20px 0;
    cursor:pointer;
}

input[type=file]{
    display:none;
}

.input-group{
    margin:15px 0;
}

input[type=number]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#1d4ed8;
}

img{
    max-width:100%;
    margin-top:20px;
    border-radius:10px;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>📏 Resize Image</h1>

<p>Resize your image online for free.</p>

<label for="imageInput" class="upload-box">

<h2>📂 Click Here To Upload Image</h2>

</label>

<input type="file"
id="imageInput"
accept="image/*">

<div class="input-group">

<input type="number"
id="width"
placeholder="Width (px)">

</div>

<div class="input-group">

<input type="number"
id="height"
placeholder="Height (px)">

</div>

<img id="preview" style="display:none;">

<button id="downloadBtn">

Download Resized Image

</button>

<br>

<a href="image-tools.html"
class="back">

⬅ Back to Image Tools

</a>

</div>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

const widthInput =
document.getElementById("width");

const heightInput =
document.getElementById("height");

let imageSrc = "";

imageInput.addEventListener("change", e => {

const file = e.target.files[0];

if (!file) return;

const reader = new FileReader();

reader.onload = function(event){

imageSrc = event.target.result;

preview.src = imageSrc;

preview.style.display = "block";

const img = new Image();

img.onload = function(){

widthInput.value = img.width;

heightInput.value = img.height;

};

img.src = imageSrc;

};

reader.readAsDataURL(file);

});

document.getElementById("downloadBtn")
.addEventListener("click", () => {

if (!imageSrc) {

alert("Please upload an image.");

return;

}

const canvas =
document.createElement("canvas");

const ctx =
canvas.getContext("2d");

const img =
new Image();

img.onload = function(){

canvas.width =
parseInt(widthInput.value);

canvas.height =
parseInt(heightInput.value);

ctx.drawImage(

img,

0,

0,

canvas.width,

canvas.height

);

const link =
document.createElement("a");

link.download =
"resized-image.png";

link.href =
canvas.toDataURL();

link.click();

};

img.src = imageSrc;

});

</script>

</body>

</html>
