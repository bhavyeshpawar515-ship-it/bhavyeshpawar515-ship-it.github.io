<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Crop Image | SmartToolsHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <style>

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f7fb;
        }

        .container{
            max-width:900px;
            margin:40px auto;
            padding:20px;
        }

        .card{
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
            text-align:center;
        }

        h1{
            color:#2563eb;
        }

        .upload-box{
            border:3px dashed #2563eb;
            border-radius:12px;
            padding:40px;
            margin:20px 0;
            cursor:pointer;
        }

        input[type=file]{
            display:none;
        }

        .row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
            margin-top:15px;
        }

        input[type=number]{
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            width:100%;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:#fff;
            font-size:18px;
            margin-top:20px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        img{
            max-width:100%;
            margin-top:20px;
            border-radius:10px;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>✂️ Crop Image</h1>

        <p>Crop your image online for free.</p>

        <label for="imageInput"
               class="upload-box">

            <h2>📂 Upload Image</h2>

        </label>

        <input type="file"
               id="imageInput"
               accept="image/*">

        <img id="preview"
             style="display:none;">

        <div class="row">

            <input type="number"
                   id="x"
                   placeholder="X">

            <input type="number"
                   id="y"
                   placeholder="Y">

        </div>

        <div class="row">

            <input type="number"
                   id="width"
                   placeholder="Width">

            <input type="number"
                   id="height"
                   placeholder="Height">

        </div>

        <button id="cropBtn">

            Crop Image

        </button>

        <a href="image-tools.html"
           class="back">

            ⬅ Back to Image Tools

        </a>

    </div>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

let imageSrc = "";

imageInput.addEventListener("change", e => {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        imageSrc = event.target.result;

        preview.src = imageSrc;

        preview.style.display = "block";

    };

    reader.readAsDataURL(file);

});

document.getElementById("cropBtn")
.addEventListener("click", () => {

    if (!imageSrc) {

        alert("Please upload an image.");

        return;

    }

    const x =
    parseInt(document.getElementById("x").value);

    const y =
    parseInt(document.getElementById("y").value);

    const width =
    parseInt(document.getElementById("width").value);

    const height =
    parseInt(document.getElementById("height").value);

    const canvas =
    document.createElement("canvas");

    const ctx =
    canvas.getContext("2d");

    const img =
    new Image();

    img.onload = function(){

        canvas.width = width;

        canvas.height = height;

        ctx.drawImage(

            img,

            x,

            y,

            width,

            height,

            0,

            0,

            width,

            height

        );

        const link =
        document.createElement("a");

        link.download =
        "cropped-image.png";

        link.href =
        canvas.toDataURL();

        link.click();

    };

    img.src = imageSrc;

});

</script>

</body>

</html>
