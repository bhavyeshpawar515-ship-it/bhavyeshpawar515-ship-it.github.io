<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#0f172a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:520px;
background:#fff;
padding:30px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input,select{
width:100%;
padding:14px;
font-size:16px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
}

input:focus,
select:focus{
border-color:#2563eb;
}

.buttons{
display:flex;
gap:10px;
margin-top:20px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.calculate{
background:#2563eb;
color:#fff;
}

.reset{
background:#ef4444;
color:#fff;
}

.result{
display:none;
margin-top:25px;
background:#f8fafc;
padding:20px;
border-radius:12px;
}

.result h2{
text-align:center;
color:#16a34a;
margin-bottom:15px;
}

.result p{
font-size:18px;
margin:10px 0;
}

.back{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
font-weight:bold;
color:#2563eb;
}

</style>

</head>

<body>

<div class="container">

<h1>🧾 GST Calculator</h1>

<div class="input-group">
<label>Amount (₹)</label>
<input type="number" id="amount" placeholder="Enter Amount">
</div>

<div class="input-group">
<label>GST Rate</label>

<select id="gstRate">
<option value="3">3%</option>
<option value="5">5%</option>
<option value="12">12%</option>
<option value="18" selected>18%</option>
<option value="28">28%</option>
</select>

</div>

<div class="buttons">

<button class="calculate"
onclick="calculateGST()">

Calculate

</button>

<button class="reset"
onclick="resetGST()">

Reset

</button>

</div>

<div class="result" id="resultBox">

<h2>GST Details</h2>

<p><strong>GST Amount:</strong> ₹ <span id="gstAmount">0</span></p>

<p><strong>Total Amount:</strong> ₹ <span id="totalAmount">0</span></p>

</div>

<a href="calculators.html" class="back">

⬅ Back to Calculators

</a>

</div>
