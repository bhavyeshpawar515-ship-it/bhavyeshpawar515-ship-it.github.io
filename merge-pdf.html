<script>

const pdfInput=document.getElementById("pdfFiles");

pdfInput.addEventListener("change",()=>{

Array.from(pdfInput.files).forEach((file,index)=>{

fileList.innerHTML+=`
<div class="file-item">
<span>${index+1}. ${file.name}</span>
</div>
`;

});

});
  

</script>
  <script>
const pdfInput = document.getElementById("pdfFiles");
const fileList = document.getElementById("fileList");
const mergeBtn = document.getElementById("mergeBtn");

pdfInput.addEventListener("change", () => {

    fileList.innerHTML = "";

    Array.from(pdfInput.files).forEach((file, index) => {

        fileList.innerHTML += `
        <div class="file-item">
            <span>📄 ${index + 1}. ${file.name}</span>
        </div>
        `;

    });

});

mergeBtn.addEventListener("click", mergePDF);

async function mergePDF() {

    const files = pdfInput.files;

    if (files.length < 2) {
        alert("Please select at least 2 PDF files.");
        return;
    }

    try {

        mergeBtn.disabled = true;
        mergeBtn.innerHTML = "Merging...";

        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const file of files) {

            const bytes = await file.arrayBuffer();

            const pdf = await PDFLib.PDFDocument.load(bytes);

            const pages = await mergedPdf.copyPages(
                pdf,
                pdf.getPageIndices()
            );

            pages.forEach(page => mergedPdf.addPage(page));
        }

        const pdfBytes = await mergedPdf.save();

        const blob = new Blob([pdfBytes], {
            type: "application/pdf"
        });

        const link = document.createElement("a");

        link.href = URL.createObjectURL(blob);

        link.download = "Merged.pdf";

        link.click();

        URL.revokeObjectURL(link.href);

        mergeBtn.disabled = false;
        mergeBtn.innerHTML = "Merge PDF";

    } catch (err) {

        alert("Error while merging PDF.");

        console.error(err);

        mergeBtn.disabled = false;
        mergeBtn.innerHTML = "Merge PDF";
    }

}
</script>
