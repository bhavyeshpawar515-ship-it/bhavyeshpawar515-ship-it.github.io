<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rotate PDF | SmartToolsHub</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js?client=ca-pub-1620926024394736"
        crossorigin="anonymous"></script>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <style>

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f7fb;
        }

        .container{
            max-width:900px;
            margin:40px auto;
            padding:20px;
        }

        .card{
            background:#fff;
            border-radius:15px;
            padding:30px;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
            text-align:center;
        }

        h1{
            color:#2563eb;
        }

        .drop-area{
            border:3px dashed #2563eb;
            border-radius:12px;
            padding:40px 20px;
            margin:25px 0;
            background:#f8fbff;
            cursor:pointer;
        }

        .drop-area:hover{
            background:#eef5ff;
        }

        input[type=file]{
            display:none;
        }

        .file-name{
            margin-top:15px;
            color:#555;
        }

        select{
            width:100%;
            padding:15px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            margin-top:20px;
        }

        .rotate-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:#fff;
            font-size:18px;
            cursor:pointer;
            margin-top:20px;
        }

        .rotate-btn:hover{
            background:#1d4ed8;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🔄 Rotate PDF</h1>

            <p>Select a PDF and rotate all pages.</p>

            <label class="drop-area" for="pdfFile">

                <h2>📂 Click Here To Select PDF</h2>

                <p>Choose your PDF file</p>

            </label>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf">

            <div
                class="file-name"
                id="fileName">
            </div>

            <select id="rotation">

                <option value="90">Rotate 90°</option>

                <option value="180">Rotate 180°</option>

                <option value="270">Rotate 270°</option>

            </select>

            <button
                class="rotate-btn"
                id="rotateBtn">

                Rotate PDF

            </button>

            <br>

            <a
                href="pdf-tools.html"
                class="back">

                ⬅ Back to PDF Tools

            </a>

        </div>

    </div>

    <script>

        const pdfFile = document.getElementById("pdfFile");

        const fileName = document.getElementById("fileName");

        const rotateBtn = document.getElementById("rotateBtn");

        pdfFile.addEventListener("change", () => {

            if (pdfFile.files.length > 0) {

                fileName.innerHTML =
                    "📄 " + pdfFile.files[0].name;

            }

        });

        rotateBtn.addEventListener("click", rotatePDF);

        async function rotatePDF() {

            const file = pdfFile.files[0];

            const degree = parseInt(
                document.getElementById("rotation").value
            );

            if (!file) {

                alert("Please select a PDF file.");

                return;

            }

            try {

                rotateBtn.disabled = true;

                rotateBtn.innerHTML = "Rotating...";

                const bytes = await file.arrayBuffer();

                const pdfDoc =
                    await PDFLib.PDFDocument.load(bytes);

                const pages = pdfDoc.getPages();

                pages.forEach(page => {

                    page.setRotation(
                        PDFLib.degrees(degree)
                    );

                });

                const pdfBytes =
                    await pdfDoc.save();

                const blob = new Blob(

                    [pdfBytes],

                    {
                        type: "application/pdf"
                    }

                );

                const link =
                    document.createElement("a");

                link.href =
                    URL.createObjectURL(blob);

                link.download = "rotated.pdf";

                link.click();

                URL.revokeObjectURL(link.href);

                rotateBtn.disabled = false;

                rotateBtn.innerHTML = "Rotate PDF";

            }

            catch (error) {

                alert("Error while rotating PDF.");

                console.log(error);

                rotateBtn.disabled = false;

                rotateBtn.innerHTML = "Rotate PDF";

            }

        }

    </script>

</body>

</html>
