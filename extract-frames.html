<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Extract Frames | SmartToolsHub</title>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<link rel="stylesheet" href="style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#2563eb,#0f172a);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2563eb;
    margin-bottom:20px;
}

.upload-box{
    border:3px dashed #2563eb;
    border-radius:12px;
    padding:40px;
    text-align:center;
    cursor:pointer;
}

input[type=file]{
    display:none;
}

video{
    width:100%;
    margin-top:20px;
    border-radius:12px;
    display:none;
}

input[type=number]{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:2px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:18px;
    margin-top:20px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:20px;
    font-weight:bold;
}

.gallery{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.gallery img{
    width:100%;
    border-radius:10px;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>📸 Extract Frames</h1>

<label for="videoInput" class="upload-box">

<h2>📂 Upload Video</h2>

<p>Select MP4, AVI, MOV or MKV</p>

</label>

<input
type="file"
id="videoInput"
accept="video/*">

<video
id="preview"
controls>
</video>

<input
type="number"
id="fps"
placeholder="Frames per second (Example: 1)">

<button onclick="extractFrames()">

Extract Frames

</button>

<p id="status"></p>

<div
class="gallery"
id="gallery">

</div>

<a href="video-tools.html" class="back">

⬅ Back to Video Tools

</a>

</div>

<script>

const videoInput =

document.getElementById(

"videoInput"

);

const preview =

document.getElementById(

"preview"

);

videoInput.addEventListener(

"change",

function(e){

const file =

e.target.files[0];

if(!file) return;

preview.src =

URL.createObjectURL(file);

preview.style.display =

"block";

}

);

async function extractFrames(){

const file =

videoInput.files[0];

if(!file){

alert(

"Please upload a video."

);

return;

}

const fps =

document.getElementById(

"fps"

).value || 1;

const status =

document.getElementById(

"status"

);

status.innerText =

"Processing...";

alert(

"ffmpeg-core.js, ffmpeg-core.wasm અને ffmpeg-core.worker.js files ઉમેર્યા પછી નીચેનો command વાપરો."

);

console.log(

`ffmpeg -i input.mp4 -vf fps=${fps} frame_%03d.png`

);

status.innerText =

"FFmpeg setup required.";

}

</script>

</body>

</html>
