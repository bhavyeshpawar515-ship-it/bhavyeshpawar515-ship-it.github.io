<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF | SmartToolsHub</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-BKYBMSDS2Q"></script>

  window.dataLayer = window.dataLayer || [];

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
width:90%;
max-width:500px;
text-align:center;
}

h1{
color:#2563eb;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:15px 0;
}

button{
width:100%;
padding:14px;
background:#2563eb;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

a{
display:block;
margin-top:20px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>🖼️ Image to PDF</h1>

<input type="file" id="imageInput" accept="image/*">

<button onclick="convertPDF()">Convert to PDF</button>

<a href="pdf-tools.html">⬅ Back to PDF Tools</a>

</div>

<script>

async function convertPDF(){

const file=document.getElementById("imageInput").files[0];

if(!file){
alert("Please select an image.");
return;
}

const reader=new FileReader();

reader.onload=function(e){

const {jsPDF}=window.jspdf;

const pdf=new jsPDF();

const img=new Image();

img.onload=function(){

pdf.addImage(img,"JPEG",10,10,190,0);

pdf.save("SmartToolsHub.pdf");

}

img.src=e.target.result;

}

reader.readAsDataURL(file);

}

</script>
<script src="smarttools.js"></script>
</body>
</html>
