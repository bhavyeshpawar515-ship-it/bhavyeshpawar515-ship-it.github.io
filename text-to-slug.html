<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text to Slug | SmartToolsHub</title>

<link rel="stylesheet" href="style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#2563eb,#0f172a);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2563eb;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
    resize:none;
    outline:none;
}

textarea:focus{
    border-color:#2563eb;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:20px;
}

button{
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:20px;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🔗 Text to Slug</h1>

<textarea
id="inputText"
placeholder="Enter text here..."></textarea>

<div class="buttons">

<button onclick="convertSlug()">

Convert

</button>

<button onclick="copySlug()">

Copy

</button>

<button onclick="clearText()">

Clear

</button>

</div>

<div class="result">

<textarea
id="outputText"
placeholder="SEO-friendly slug..."
readonly></textarea>

</div>

<a href="text-tools.html" class="back">

⬅ Back to Text Tools

</a>

</div>

<script>

function convertSlug(){

    const input = document
        .getElementById("inputText")
        .value;

    const slug = input

        .toLowerCase()

        .trim()

        .replace(/[^a-z0-9\s-]/g, "")

        .replace(/\s+/g, "-")

        .replace(/-+/g, "-");

    document.getElementById(
        "outputText"
    ).value = slug;

}

function copySlug(){

    const output = document
        .getElementById("outputText");

    navigator.clipboard
        .writeText(output.value);

    alert("Slug copied!");

}

function clearText(){

    document.getElementById(
        "inputText"
    ).value = "";

    document.getElementById(
        "outputText"
    ).value = "";

}

</script>

</body>

</html>
